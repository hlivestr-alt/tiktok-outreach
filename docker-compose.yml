services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: affiliate
      POSTGRES_PASSWORD: affiliate
      POSTGRES_DB: affiliate_outreach
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affiliate -d affiliate_outreach"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://affiliate:affiliate@postgres:5432/affiliate_outreach?schema=public
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: ["outbound-mock"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://affiliate:affiliate@postgres:5432/affiliate_outreach?schema=public
      REDIS_URL: redis://redis:6379
      APP_MODE: ${APP_MODE:-mock}
      SHOP_TIMEZONE: ${SHOP_TIMEZONE:-Asia/Jakarta}
      MAX_RECIPIENTS_PER_CAMPAIGN: ${MAX_RECIPIENTS_PER_CAMPAIGN:-1000}
      MAX_DISPATCH_ATTEMPTS_PER_CAMPAIGN: ${MAX_DISPATCH_ATTEMPTS_PER_CAMPAIGN:-4000}
      MAX_SENDS_PER_DAY: ${MAX_SENDS_PER_DAY:-1000}
      MAX_DISPATCHES_PER_MINUTE: ${MAX_DISPATCHES_PER_MINUTE:-10}
      MOCK_RECONCILIATION_DELAYS_MS: ${MOCK_RECONCILIATION_DELAYS_MS:-300000,1800000,7200000}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  discovery-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.discovery-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://affiliate:affiliate@postgres:5432/affiliate_outreach?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }

  history-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.history-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://affiliate:affiliate@postgres:5432/affiliate_outreach?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
