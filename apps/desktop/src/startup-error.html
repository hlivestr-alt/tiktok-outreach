<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>TikTok Outreach — Service unavailable</title><style>
:root{color-scheme:dark;font:14px Inter,"Segoe UI",sans-serif;background:#0a0a0a;color:#f5f5f5}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden}.titlebar{height:34px;border-bottom:1px solid #262626;background:#0d0d0d;display:flex;align-items:center;padding-left:12px;color:#a1a1aa;font-size:12px;-webkit-app-region:drag}.controls{margin-left:auto;height:34px;display:flex;-webkit-app-region:no-drag}.controls button{width:46px;border:0;background:transparent;color:#a1a1aa}.controls button:hover{background:#1a1a1a;color:#fff}.controls .close:hover{background:#dc2626}.shell{height:calc(100vh - 34px);display:grid;grid-template-columns:236px 1fr}.rail{background:#0d0d0d;border-right:1px solid #262626;padding:20px}.brand{display:flex;align-items:center;gap:10px}.mark{width:30px;height:30px;border:1px solid #343434;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700}.brand strong,.brand span{display:block}.brand span{font-size:11px;color:#737373;margin-top:2px}.content{display:grid;place-items:center;padding:40px}.error{width:min(540px,100%)}h1{margin:0 0 10px;font-size:27px;font-weight:650;letter-spacing:-.025em}p{margin:0;color:#a1a1aa;line-height:1.6}.actions{display:flex;gap:8px;margin-top:24px}button{height:38px;padding:0 14px;border:1px solid #343434;border-radius:5px;background:transparent;color:#f5f5f5;font:inherit;cursor:pointer}button.primary{background:#f5f5f5;color:#0a0a0a;border-color:#f5f5f5}.details{display:none;margin-top:18px;padding-top:16px;border-top:1px solid #262626;color:#737373;font:12px/1.6 ui-monospace,monospace}.details.visible{display:block}
</style><style>@media(prefers-color-scheme:light){:root{color-scheme:light;background:#f7f7f5;color:#18181b}.titlebar,.rail{background:#f4f4f2}.titlebar,.rail,.shell{border-color:#e2e2df}.controls button{color:#71717a}.controls button:hover{background:#e9e9e6;color:#18181b}.brand span,p{color:#71717a}.mark,button{border-color:#d4d4d0;color:#18181b}.primary{background:#18181b!important;color:#fff!important;border-color:#18181b!important}.details{border-color:#e2e2df;color:#71717a}}</style></head><body><header class="titlebar">TikTok Outreach<div class="controls"><button aria-label="Minimize" id="min">−</button><button aria-label="Maximize or restore" id="max">□</button><button aria-label="Close" class="close" id="close">×</button></div></header><div class="shell"><aside class="rail"><div class="brand"><span class="mark">TO</span><div><strong>TikTok Outreach</strong><span>Creator operations</span></div></div></aside><main class="content"><section class="error"><h1>Unable to connect to the local service</h1><p>The desktop shell could not load the Outreach web application. Start or check the existing local web service, then retry. No campaign or provider action was attempted.</p><div class="actions"><button class="primary" id="retry">Retry</button><button id="diagnostics">Diagnostics</button></div><pre class="details" id="details"></pre></section></main></div><script>
const api=window.outreachDesktop;document.querySelector('.titlebar').ondblclick=()=>api.toggleMaximize();document.querySelector('.controls').ondblclick=e=>e.stopPropagation();document.querySelector('#min').onclick=()=>api.minimize();document.querySelector('#max').onclick=()=>api.toggleMaximize();document.querySelector('#close').onclick=()=>api.close();document.querySelector('#retry').onclick=()=>api.retry();document.querySelector('#diagnostics').onclick=async()=>{const value=await api.diagnostics();const node=document.querySelector('#details');node.textContent=`Target: ${value.target}\nApp: ${value.appVersion}\nPlatform: ${value.platform}`;node.classList.add('visible')};
</script></body></html>
